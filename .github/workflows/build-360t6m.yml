name: Build ImmortalWrt 360T6M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout builder
        uses: actions/checkout@v4

      # ============================================================
      # 2. Build dependencies
      # Python3-distutils is intentionally NOT installed:
      # Ubuntu 24.04 no longer provides it as a separate package.
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            rsync \
            squashfs-tools \
            unzip \
            wget \
            zlib1g-dev

          python3 --version
          dtc --version
          gcc --version
          make --version

      # ============================================================
      # 3. Find source directory
      # ============================================================
      - name: Locate source tree
        run: |
          set -eux

          if [ -d "source" ]; then
            echo "SOURCE_DIR=source" >> "$GITHUB_ENV"
          else
            echo "ERROR: source directory does not exist"
            exit 1
          fi

      # ============================================================
      # 4. Feed preparation
      # ============================================================
      - name: Update feeds
        working-directory: source
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 5. Verify MT7621 target
      # ============================================================
      - name: Verify MT7621 target
        working-directory: source
        run: |
          set -eux

          test -d target/linux/ramips
          test -d target/linux/ramips/dts
          test -f target/linux/ramips/image/mt7621.mk

          echo "===== RAMIPS TARGET ====="
          grep -n "ramips_mt7621" target/linux/ramips/Makefile || true

      # ============================================================
      # 6. Create 360T6M DTS
      #
      # This is based on the REAL DTS extracted from the working
      # 360T6M router.
      # ============================================================
      - name: Create 360T6M DTS
        working-directory: source
        run: |
          set -eux

          cat > target/linux/ramips/dts/mt7621_360_t6m.dts <<'DTS'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          #include "mt7621.dtsi"
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "360,360t6m", "mediatek,mt7621-soc";
              model = "360T6M";

              aliases {
                  led-boot = &led_system;
                  led-upgrade = &led_system;
                  led-failsafe = &led_system;
                  serial0 = &uartlite;
                  label-mac-device = &gmac0;
              };

              chosen {
                  bootargs = "console=ttyS0,115200";
              };

              leds {
                  compatible = "gpio-leds";

                  led_system: system {
                      label = "green:system";
                      gpios = <&gpio 15 GPIO_ACTIVE_HIGH>;
                  };

                  power {
                      label = "red:power";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  wps {
                      label = "wps";
                      gpios = <&gpio 6 GPIO_ACTIVE_LOW>;
                      linux,code = <KEY_WPS_BUTTON>;
                  };

                  reset {
                      label = "reset";
                      gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
                      linux,code = <KEY_RESTART>;
                  };
              };
          };

          &nand {
              status = "okay";

              partitions {
                  compatible = "fixed-partitions";
                  #address-cells = <1>;
                  #size-cells = <1>;

                  partition@0 {
                      label = "Bootloader";
                      reg = <0x000000 0x080000>;
                      read-only;
                  };

                  partition@80000 {
                      label = "Nvram";
                      reg = <0x080000 0x040000>;
                      read-only;
                  };

                  partition@c0000 {
                      label = "Bdata";
                      reg = <0x0c0000 0x040000>;
                      read-only;
                  };

                  factory: partition@100000 {
                      label = "Factory";
                      reg = <0x100000 0x080000>;
                      read-only;

                      compatible = "nvmem-cells";
                      #address-cells = <1>;
                      #size-cells = <1>;

                      macaddr_factory_0: macaddr@e000 {
                          reg = <0xe000 0x6>;
                      };

                      macaddr_factory_1: macaddr@e006 {
                          reg = <0xe006 0x6>;
                      };
                  };

                  partition@180000 {
                      label = "crash";
                      reg = <0x180000 0x040000>;
                      read-only;
                  };

                  partition@1c0000 {
                      label = "crash_log";
                      reg = <0x1c0000 0x040000>;
                      read-only;
                  };

                  partition@200000 {
                      label = "kernel";
                      reg = <0x200000 0x400000>;
                  };

                  partition@600000 {
                      label = "ubi";
                      reg = <0x600000 0x7a00000>;
                  };
              };
          };

          &pcie {
              status = "okay";

              reset-gpios = <&gpio 19 GPIO_ACTIVE_LOW>;
          };

          /*
           * The real 360T6M uses PCIe with an MT7915 device.
           * EEPROM is read from Factory at offset 0.
           */
          &pcie1 {
              wifi@0,0 {
                  compatible = "mediatek,mt76";
                  reg = <0x0000 0 0 0 0>;
                  mediatek,mtd-eeprom = <&factory 0x0>;
              };
          };

          &gmac0 {
              nvmem-cells = <&macaddr_factory_0>;
              nvmem-cell-names = "mac-address";
          };

          &gmac1 {
              nvmem-cells = <&macaddr_factory_1>;
              nvmem-cell-names = "mac-address";
          };

          &gsw {
              mediatek,mdio = <&mdio>;
              mediatek,portmap = "llllw";
              mediatek,mcm;
              mt7530,direct-phy-access;

              port@6 {
                  reg = <6>;
                  ethernet = <&gmac0>;
                  phy-mode = "rgmii";

                  fixed-link {
                      speed = <1000>;
                      full-duplex;
                      pause;
                  };
              };
          };

          &switch0 {
              /delete-property/ compatible;
          };

          &state_default {
              gpio {
                  groups = "jtag", "wdt", "uart3";
                  function = "gpio";
              };
          };

          &pinctrl {
              state_default: pinctrl0 {
                  gpio {
                      groups = "jtag", "wdt", "uart3";
                      function = "gpio";
                  };
              };
          };
          DTS

      # ============================================================
      # 7. Add 360T6M image definition
      # ============================================================
      - name: Add 360T6M image profile
        working-directory: source
        run: |
          set -eux

          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'

          define Device/360_t6m
            $(Device/dsa-migration)
            $(Device/uimage-lzma-loader)

            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M

            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_SIZE := 4096k

            UBINIZE_OPTS := -E 5

            IMAGE_SIZE := 124928k

            IMAGES += firmware.bin

            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata

            IMAGE/firmware.bin := append-kernel | \
              pad-to $$(KERNEL_SIZE) | \
              append-ubi | \
              check-size

            DEVICE_PACKAGES += \
              kmod-mt7915e \
              kmod-mt7915-firmware \
              uboot-envtools
          endef

          TARGET_DEVICES += 360_t6m
          EOF

      # ============================================================
      # 8. Verify DTS syntax BEFORE starting the build
      # ============================================================
      - name: Validate 360T6M DTS
        working-directory: source
        run: |
          set -eux

          echo "===== DTS FILE ====="
          sed -n '1,260p' target/linux/ramips/dts/mt7621_360_t6m.dts

          echo
          echo "===== CHECK DTS WITH DTC ====="

          dtc \
            -I dts \
            -O dtb \
            -o /tmp/360t6m.dtb \
            -i target/linux/ramips/dts \
            target/linux/ramips/dts/mt7621_360_t6m.dts

          test -s /tmp/360t6m.dtb

          echo
          echo "DTS compilation successful."
          ls -lh /tmp/360t6m.dtb

      # ============================================================
      # 9. Verify image profile
      # ============================================================
      - name: Verify 360T6M profile
        working-directory: source
        run: |
          set -eux

          echo "===== 360T6M PROFILE ====="

          grep -n -A30 -B5 \
            "define Device/360_t6m" \
            target/linux/ramips/image/mt7621.mk

          echo
          echo "===== DTS REFERENCES ====="

          grep -RniE \
            '360_t6m|360T6M|360,360t6m' \
            target/linux/ramips \
            || true

      # ============================================================
      # 10. Configure target
      # ============================================================
      - name: Configure MT7621 / 360T6M
        working-directory: source
        run: |
          set -eux

          cat > /tmp/360t6m.config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y

          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip6tables-nft=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_tcpdump=y
          EOF

          cp /tmp/360t6m.config .config

          make defconfig

          echo
          echo "===== FINAL TARGET CONFIG ====="

          grep -E \
            '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621|360_t6m' \
            .config \
            || true

      # ============================================================
      # 11. Check required packages exist
      # ============================================================
      - name: Check required packages
        working-directory: source
        run: |
          set -eux

          echo "===== PACKAGE CHECK ====="

          for p in \
            kmod-mt7915e \
            kmod-mt7915-firmware \
            kmod-nf-tproxy \
            kmod-nft-tproxy \
            kmod-tun
          do
            echo "Checking: $p"

            grep -Rqs \
              "Package: $p" \
              package \
              feeds \
              2>/dev/null \
              || {
                echo "ERROR: package $p was not found"
                exit 1
              }
          done

      # ============================================================
      # 12. Download sources
      # ============================================================
      - name: Download sources
        working-directory: source
        run: |
          set -eux

          make download -j2 V=s

      # ============================================================
      # 13. Build 360T6M
      # ============================================================
      - name: Build firmware
        working-directory: source
        run: |
          set -eux

          make -j$(nproc) \
            target/linux/compile \
            V=s

          make -j$(nproc) \
            target/install \
            V=s

      # ============================================================
      # 14. Find firmware
      # ============================================================
      - name: Locate firmware files
        working-directory: source
        run: |
          set -eux

          echo "===== FIRMWARE FILES ====="

          find bin/targets/ramips/mt7621 \
            -maxdepth 3 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      # ============================================================
      # 15. Verify output
      # ============================================================
      - name: Verify output
        working-directory: source
        run: |
          set -eux

          OUT="bin/targets/ramips/mt7621"

          test -d "$OUT"

          find "$OUT" \
            -type f \
            \( \
              -name '*360*t6m*' \
              -o -name '*360_t6m*' \
              -o -name '*360T6M*' \
            \) \
            -print

      # ============================================================
      # 16. Upload firmware
      # ============================================================
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M
          path: |
            source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
