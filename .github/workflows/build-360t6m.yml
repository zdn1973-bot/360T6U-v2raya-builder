تمت إضافة الحزم التالية لضمان عمل ZRAM بكفاءة مع إمكانية التحكم بها من الواجهة:

kmod-zram: نواة تشغيل ZRAM.

zram-swap: السكربت المسؤول عن تفعيل مساحة الـ Swap تلقائياً عند الإقلاع.

luci-app-zram: واجهة التحكم في إعدادات ZRAM من خلال صفحة LuCI لتغيير الحجم والإعدادات بسهولة.

تم تحديث قائمة التحقق داخل سكربت Github Actions للتأكد من بناء الحزم وإضافتها لملف الروم النهائي، كما تم تغيير اسم المخرج النهائي (Artifact) إلى ImmortalWrt-360T6M-Router1-v2raya-wireguard-zram.




‫Gemini هو نموذج ذكاء اصطناعي وقد يعرض معلومات خاطئة.

