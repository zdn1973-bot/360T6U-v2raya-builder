name: Build ImmortalWrt 360T6M v2rayA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone --depth=1 --branch=openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git source

          cd source

          git log -1 --oneline

      - name: Copy 360T6M DTS
        run: |
          set -e

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp target/linux/ramips/dts/mt7621_360_t6m.dts source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Fix green LED
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          sed -i 's/GPIO_ACTIVE_HIGH/GPIO_ACTIVE_LOW/g' "$DTS"

          if ! grep -q 'default-state = "on";' "$DTS"; then
            sed -i '/label = "green:system";/a\		default-state = "on";' "$DTS"
          fi

          grep -n -A5 -B2 'green:system' "$DTS"

      - name: Update feeds
        working-directory: source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 360T6M profile
        working-directory: source
        run: |
          set -e

          IMAGE="target/linux/ramips/image/mt7621.mk"

          echo 'define Device/360_t6m' >> "$IMAGE"
          echo '  $(Device/dsa-migration)' >> "$IMAGE"
          echo '  $(Device/uimage-lzma-loader)' >> "$IMAGE"
          echo '  DEVICE_VENDOR := 360' >> "$IMAGE"
          echo '  DEVICE_MODEL := T6M' >> "$IMAGE"
          echo '  DEVICE_DTS := mt7621_360_t6m' >> "$IMAGE"
          echo '  SUPPORTED_DEVICES += 360,360t6m' >> "$IMAGE"
          echo '  BLOCKSIZE := 128k' >> "$IMAGE"
          echo '  PAGESIZE := 2048' >> "$IMAGE"
          echo '  KERNEL_SIZE := 4096k' >> "$IMAGE"
          echo '  UBINIZE_OPTS := -E 5' >> "$IMAGE"
          echo '  IMAGE_SIZE := 124928k' >> "$IMAGE"
          echo '  IMAGES += firmware.bin' >> "$IMAGE"
          echo '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' >> "$IMAGE"
          echo '  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' >> "$IMAGE"
          echo '  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools' >> "$IMAGE"
          echo 'endef' >> "$IMAGE"
          echo 'TARGET_DEVICES += 360_t6m' >> "$IMAGE"

          echo "===== 360T6M PROFILE ====="

          grep -n -A25 'define Device/360_t6m' "$IMAGE"

      - name: Verify DTS
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"

          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"

          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"

          grep -q 'GPIO_ACTIVE_LOW' "$DTS"
          grep -q 'default-state = "on"' "$DTS"

          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"

          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "DTS verification successful."

      - name: Configure target
        working-directory: source
        run: |
          set -e

          echo 'CONFIG_TARGET_ramips=y' > .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_iptables-mod-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_xray-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config

          make defconfig

          echo "===== TARGET ====="
          grep -E '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621' .config || true

          echo "===== PACKAGES ====="
          grep -E '^CONFIG_PACKAGE_(kmod-nf-tproxy|kmod-nft-tproxy|iptables-mod-tproxy|v2raya|luci-app-v2raya|xray-core|kmod-tun)=' .config || true

      - name: Build firmware
        working-directory: source
        run: |
          set -e

          make download -j2 V=s

          make -j$(nproc) V=s

      - name: Show output
        working-directory: source
        run: |
          set -e

          echo "===== GENERATED FILES ====="

          find bin/targets/ramips/mt7621 -type f -print | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-v2raya
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
