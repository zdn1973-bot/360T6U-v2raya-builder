name: Build ImmortalWrt 360T6M Router1 v2raya

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M Router1 v2raya
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time \
            squashfs-tools

          echo "===== TOOLS ====="
          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version
          unsquashfs -version || true

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          echo "===== SOURCE ====="
          git log -1 --oneline
          git branch --show-current

      - name: Patch MT7621 NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()

          entry = '        360,360t6m|\\'

          if not any("360,360t6m" in line for line in lines):
              in_platform = False
              insert_at = None

              for i, line in enumerate(lines):
                  stripped = line.strip()

                  if stripped.startswith("platform_do_upgrade()"):
                      in_platform = True
                      continue

                  if in_platform and stripped == 'case "$board" in':
                      insert_at = i + 1
                      break

              if insert_at is None:
                  raise SystemExit(
                      "ERROR: platform_do_upgrade case not found"
                  )

              lines.insert(insert_at, entry)

              path.write_text("\n".join(lines) + "\n")

          print("===== MT7621 NAND HANDLER =====")

          for i, line in enumerate(path.read_text().splitlines(), 1):
              if "360,360t6m" in line:
                  start = max(1, i - 4)
                  end = min(len(lines), i + 10)

                  for n in range(start, end + 1):
                      print(f"{n}: {path.read_text().splitlines()[n-1]}")
                  break
          else:
              raise SystemExit(
                  "ERROR: 360T6M handler missing"
              )
          PY

          grep -Fq \
            '360,360t6m|\' \
            "$PLATFORM"

      - name: Copy DTS
        run: |
          set -e

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Fix green LED
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          sed -i \
            's/GPIO_ACTIVE_HIGH/GPIO_ACTIVE_LOW/g' \
            "$DTS"

          if ! grep -q 'default-state = "on";' "$DTS"; then
            sed -i \
              '/label = "green:system";/a\		default-state = "on";' \
              "$DTS"
          fi

          echo "===== GREEN LED ====="

          grep -n \
            -A5 \
            -B2 \
            'green:system' \
            "$DTS"

      - name: Update feeds
        working-directory: source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Router1 device profile
        working-directory: source
        run: |
          set -e

          IMAGE="target/linux/ramips/image/mt7621.mk"

          printf '%s\n' \
            'define Device/360_t6m' \
            '  $(Device/dsa-migration)' \
            '  $(Device/uimage-lzma-loader)' \
            '  DEVICE_VENDOR := 360' \
            '  DEVICE_MODEL := T6M' \
            '  DEVICE_DTS := mt7621_360_t6m' \
            '  SUPPORTED_DEVICES += 360,360t6m' \
            '  BLOCKSIZE := 128k' \
            '  PAGESIZE := 2048' \
            '  KERNEL_SIZE := 4096k' \
            '  UBINIZE_OPTS := -E 5' \
            '  IMAGE_SIZE := 124416k' \
            '  IMAGES += firmware.bin' \
            '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' \
            '  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' \
            '  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy kmod-ipt-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools' \
            'endef' \
            'TARGET_DEVICES += 360_t6m' \
            >> "$IMAGE"

          echo "===== DEVICE PROFILE ====="

          grep -n \
            -A35 \
            'define Device/360_t6m' \
            "$IMAGE"

      - name: Verify DTS
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"

          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"

          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"

          grep -q 'GPIO_ACTIVE_LOW' "$DTS"
          grep -q 'default-state = "on"' "$DTS"

          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"

          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "DTS verification successful."

      - name: Configure target
        working-directory: source
        run: |
          set -e

          echo 'CONFIG_TARGET_ramips=y' > .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-ipt-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_iptables-mod-tproxy=y' >> .config

          echo 'CONFIG_PACKAGE_v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_xray-core=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config

          make defconfig

      - name: Verify configuration
        working-directory: source
        run: |
          set -e

          grep -q \
            '^CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y$' \
            .config

          grep -q '^CONFIG_PACKAGE_kmod-nf-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-ipt-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_iptables-mod-tproxy=y$' .config

          grep -q '^CONFIG_PACKAGE_v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-tun=y$' .config

          echo "Configuration verified."

      - name: Download sources
        working-directory: source
        run: |
          set -e

          make download -j2 V=s

      - name: Build
        working-directory: source
        run: |
          set -e

          make -j$(nproc) V=s

      - name: Verify generated firmware
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          test -f "$IMAGE"

          echo "===== FIRMWARE ====="
          ls -lh "$IMAGE"

      - name: Verify sysupgrade structure
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          rm -rf /tmp/image-check
          mkdir -p /tmp/image-check

          tar -xf "$IMAGE" -C /tmp/image-check

          echo "===== SYSUPGRADE ====="

          find \
            /tmp/image-check \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          test -f \
            /tmp/image-check/sysupgrade-360_t6m/kernel

          test -f \
            /tmp/image-check/sysupgrade-360_t6m/root

          test -s \
            /tmp/image-check/sysupgrade-360_t6m/kernel

          test -s \
            /tmp/image-check/sysupgrade-360_t6m/root

      - name: Verify rootfs packages
        working-directory: source
        run: |
          set -e

          ROOT="/tmp/image-check/sysupgrade-360_t6m/root"

          echo "===== ROOT TYPE ====="
          file "$ROOT"

          unsquashfs \
            -l \
            "$ROOT" \
            > /tmp/rootfs-list.txt

          test -s /tmp/rootfs-list.txt

          grep -q \
            '/usr/bin/v2raya$' \
            /tmp/rootfs-list.txt

          grep -q \
            '/usr/bin/xray$' \
            /tmp/rootfs-list.txt

          grep -q \
            '/etc/init.d/v2raya$' \
            /tmp/rootfs-list.txt

          grep -E -q \
            'tproxy.*\.ko$|nf.*tproxy.*\.ko$|nft.*tproxy.*\.ko$|ipt.*tproxy.*\.ko$' \
            /tmp/rootfs-list.txt

          echo "===== PACKAGE VERIFICATION ====="
          echo "v2rayA: OK"
          echo "Xray: OK"
          echo "TPROXY: OK"

      - name: Verify rootfs upgrade script
        working-directory: source
        run: |
          set -e

          grep -q \
            '/lib/upgrade/platform.sh$' \
            /tmp/rootfs-list.txt

          echo "platform.sh: OK"

      - name: Show final image
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          echo "===== FINAL IMAGE ====="
          ls -lh "$IMAGE"

          echo
          echo "===== SHA256 ====="
          sha256sum "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-Router1-v2raya
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
