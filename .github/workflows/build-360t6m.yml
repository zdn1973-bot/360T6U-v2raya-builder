لإعداد WireGuard (والذي يبدو أنه اتصال Cloudflare WARP بناءً على الإعدادات) على نظام ImmortalWrt 23.05 الخاص بك (راوتر 360 T6M)، أسرع وأدق طريقة هي استخدام سطر الأوامر (SSH)، أو يمكنك استخدام واجهة الويب (LuCI).

إليك الطريقتين، اختر ما يناسبك:

الطريقة الأولى: عبر سطر الأوامر SSH (الأسرع والأدق)
قم بتسجيل الدخول إلى الراوتر عبر SSH (باستخدام برنامج مثل PuTTY أو عبر الطرفية) والصق الأوامر التالية بالتسلسل.

(ملاحظة: تم استبدال النطاق engage.cloudflareclient.com بعنوان الـ IP الخاص به 162.159.192.1 لأن راوترات OpenWrt أحياناً تواجه مشكلة في ترجمة النطاقات قبل اتصال الـ VPN).

Bash
# 1. تحديث الحزم وتثبيت أدوات WireGuard (في حال لم تكن مثبتة مسبقاً في ImmortalWrt)
opkg update
opkg install wireguard-tools luci-app-wireguard

# 2. إنشاء واجهة WireGuard (wg0) وإضافة الإعدادات الأساسية
uci set network.wg0=interface
uci set network.wg0.proto='wireguard'
uci set network.wg0.private_key='6HyP2cf9CAFf6y0zZYfYwH+hcnlrIwXu0I6yfe2TUl0='
uci add_list network.wg0.addresses='172.16.0.2/32'
uci add_list network.wg0.addresses='2606:4700:110:82a1:c5d6:8f59:d99d:4ffc/128'
uci set network.wg0.mtu='1280'

# 3. إعداد بيانات النظير (Peer / Cloudflare WARP)
uci add network wireguard_wg0
uci set network.@wireguard_wg0[-1]=wireguard_wg0
uci set network.@wireguard_wg0[-1].name='wg0_client'
uci set network.@wireguard_wg0[-1].public_key='bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo='
uci set network.@wireguard_wg0[-1].endpoint_host='162.159.192.1'
uci set network.@wireguard_wg0[-1].endpoint_port='2408'
uci set network.@wireguard_wg0[-1].route_allowed_ips='1'
uci set network.@wireguard_wg0[-1].persistent_keepalive='25'
uci add_list network.@wireguard_wg0[-1].allowed_ips='0.0.0.0/0'
uci add_list network.@wireguard_wg0[-1].allowed_ips='::/0'

# 4. توجيه الواجهة إلى جدار الحماية (WAN Zone)
uci add_list firewall.@zone[1].network='wg0'

# 5. حفظ الإعدادات وإعادة تشغيل الشبكة
uci commit
/etc/init.d/network restart
/etc/init.d/firewall restart
