name: Build ImmortalWrt 360T6M v2rayA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M v2rayA
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time \
            squashfs-tools

          echo "===== TOOL VERSIONS ====="

          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version

          echo "===== SQUASHFS TOOL ====="

          unsquashfs -version || true

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          echo "===== SOURCE ====="

          git log -1 --oneline
          git branch --show-current

      - name: Add 360T6M NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="package/base-files/files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("package/base-files/files/lib/upgrade/platform.sh")
          text = path.read_text()

          entry = '        360,360t6m|\\\\\n'

          if entry not in text:
              marker = '        case "$board" in\n'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: case board marker not found in platform.sh"
                  )

              text = text.replace(
                  marker,
                  marker + entry,
                  1
              )

              path.write_text(text)
          PY

          echo "===== 360T6M NAND UPGRADE HANDLER ====="

          grep -n \
            -A15 \
            -B3 \
            '360,360t6m' \
            "$PLATFORM"

      - name: Verify 360T6M NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="package/base-files/files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          grep -q \
            '360,360t6m|\\' \
            "$PLATFORM"

          echo "360T6M NAND upgrade handler verified."

      - name: Copy 360T6M DTS
        run: |
          set -e

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

          echo "===== DTS COPIED ====="

          ls -lh \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Fix green LED
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          sed -i \
            's/GPIO_ACTIVE_HIGH/GPIO_ACTIVE_LOW/g' \
            "$DTS"

          if ! grep -q 'default-state = "on";' "$DTS"; then
            sed -i \
              '/label = "green:system";/a\		default-state = "on";' \
              "$DTS"
          fi

          echo "===== GREEN LED ====="

          grep -n \
            -A5 \
            -B2 \
            'green:system' \
            "$DTS"

      - name: Update feeds
        working-directory: source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 360T6M device profile
        working-directory: source
        run: |
          set -e

          IMAGE="target/linux/ramips/image/mt7621.mk"

          printf '%s\n' \
            'define Device/360_t6m' \
            '  $(Device/dsa-migration)' \
            '  $(Device/uimage-lzma-loader)' \
            '  DEVICE_VENDOR := 360' \
            '  DEVICE_MODEL := T6M' \
            '  DEVICE_DTS := mt7621_360_t6m' \
            '  SUPPORTED_DEVICES += 360,360t6m' \
            '  BLOCKSIZE := 128k' \
            '  PAGESIZE := 2048' \
            '  KERNEL_SIZE := 4096k' \
            '  UBINIZE_OPTS := -E 5' \
            '  IMAGE_SIZE := 124928k' \
            '  IMAGES += firmware.bin' \
            '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' \
            '  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' \
            '  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy kmod-ipt-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools' \
            'endef' \
            'TARGET_DEVICES += 360_t6m' \
            >> "$IMAGE"

          echo "===== DEVICE PROFILE ====="

          grep -n \
            -A30 \
            'define Device/360_t6m' \
            "$IMAGE"

      - name: Verify DTS
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          grep -q \
            'compatible = "360,360t6m"' \
            "$DTS"

          grep -q \
            'model = "360T6M"' \
            "$DTS"

          grep -q \
            'label = "wan"' \
            "$DTS"

          grep -q \
            'label = "lan1"' \
            "$DTS"

          grep -q \
            'label = "lan2"' \
            "$DTS"

          grep -q \
            'label = "lan3"' \
            "$DTS"

          grep -q \
            'compatible = "mediatek,mt76"' \
            "$DTS"

          grep -q \
            'mediatek,mtd-eeprom' \
            "$DTS"

          grep -q \
            'GPIO_ACTIVE_LOW' \
            "$DTS"

          grep -q \
            'default-state = "on"' \
            "$DTS"

          grep -q \
            'KEY_WPS_BUTTON' \
            "$DTS"

          grep -q \
            'KEY_RESTART' \
            "$DTS"

          grep -q \
            'label = "kernel"' \
            "$DTS"

          grep -q \
            'label = "ubi"' \
            "$DTS"

          echo "DTS verification successful."

      - name: Configure target
        working-directory: source
        run: |
          set -e

          echo 'CONFIG_TARGET_ramips=y' > .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-ipt-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_iptables-mod-tproxy=y' >> .config

          echo 'CONFIG_PACKAGE_v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_xray-core=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config

          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config

          echo "===== MAKE DEFCONFIG ====="

          make defconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621|^CONFIG_PACKAGE_(kmod-nf-tproxy|kmod-nft-tproxy|kmod-ipt-tproxy|iptables-mod-tproxy|v2raya|luci-app-v2raya|xray-core|kmod-tun)=' \
            .config \
            || true

      - name: Verify package selections
        working-directory: source
        run: |
          set -e

          grep -q \
            '^CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_kmod-nf-tproxy=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_kmod-ipt-tproxy=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_iptables-mod-tproxy=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_v2raya=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_luci-app-v2raya=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_xray-core=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_kmod-tun=y$' \
            .config

          echo "All required packages are enabled."

      - name: Download sources
        working-directory: source
        run: |
          set -e

          make download -j2 V=s

      - name: Build firmware
        working-directory: source
        run: |
          set -e

          echo "===== START BUILD ====="

          make -j$(nproc) V=s

      - name: Verify firmware
        working-directory: source
        run: |
          set -e

          OUT="bin/targets/ramips/mt7621"

          IMAGE="$OUT/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          test -f "$IMAGE"

          echo "===== FIRMWARE ====="

          ls -lh "$IMAGE"

      - name: Inspect sysupgrade rootfs
        working-directory: source
        run: |
          set -e

          OUT="bin/targets/ramips/mt7621"

          IMAGE="$OUT/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          test -f "$IMAGE"

          rm -rf /tmp/image-check
          mkdir -p /tmp/image-check

          echo "===== EXTRACT SYSUPGRADE ====="

          tar -xf \
            "$IMAGE" \
            -C /tmp/image-check

          echo "===== SYSUPGRADE CONTENT ====="

          find \
            /tmp/image-check \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          ROOT="$(
            find \
              /tmp/image-check \
              -type f \
              -name root \
              -print \
              -quit
          )"

          if [ -z "$ROOT" ]; then
            echo "ERROR: root image not found"
            exit 1
          fi

          test -f "$ROOT"

          echo "===== ROOT IMAGE ====="

          echo "$ROOT"

          file "$ROOT"

          ls -lh "$ROOT"

          echo
          echo "===== ROOTFS CONTENT ====="

          unsquashfs \
            -l \
            "$ROOT" \
            > /tmp/rootfs-list.txt

          test -s /tmp/rootfs-list.txt

          echo
          echo "===== V2RAYA/XRAY ====="

          grep -E \
            '(^|/)(usr/bin/v2raya|usr/bin/xray|etc/init.d/v2raya)$' \
            /tmp/rootfs-list.txt \
            || true

          echo
          echo "===== TPROXY ====="

          grep -Ei \
            'tproxy.*\.ko$|nf.*tproxy|nft.*tproxy|ipt.*tproxy' \
            /tmp/rootfs-list.txt \
            || true

          echo
          echo "===== OPKG STATUS ====="

          grep \
            'usr/lib/opkg/status$' \
            /tmp/rootfs-list.txt \
            || true

      - name: Verify v2rayA and Xray in real rootfs
        working-directory: source
        run: |
          set -e

          LIST="/tmp/rootfs-list.txt"

          test -f "$LIST"

          grep -q \
            '/usr/bin/v2raya$' \
            "$LIST"

          echo "OK: /usr/bin/v2raya"

          grep -q \
            '/usr/bin/xray$' \
            "$LIST"

          echo "OK: /usr/bin/xray"

          grep -q \
            '/etc/init.d/v2raya$' \
            "$LIST"

          echo "OK: /etc/init.d/v2raya"

      - name: Verify TPROXY in real rootfs
        working-directory: source
        run: |
          set -e

          LIST="/tmp/rootfs-list.txt"

          grep -E \
            -q \
            'tproxy.*\.ko$|nf.*tproxy.*\.ko$|nft.*tproxy.*\.ko$|ipt.*tproxy.*\.ko$' \
            "$LIST"

          echo "OK: TPROXY kernel module found in rootfs."

      - name: Verify rootfs package database
        working-directory: source
        run: |
          set -e

          LIST="/tmp/rootfs-list.txt"

          grep -q \
            'usr/lib/opkg/status$' \
            "$LIST"

          echo "OK: opkg package database exists in rootfs."

      - name: Show generated files
        working-directory: source
        run: |
          set -e

          echo "===== GENERATED FILES ====="

          find \
            bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' \
            | sort

      - name: Generate SHA256
        working-directory: source
        run: |
          set -e

          echo "===== SHA256 ====="

          find \
            bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            -exec sha256sum {} \; \
            | sort \
            | tee /tmp/360t6m-sha256.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-v2raya-NAND-FIX
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
