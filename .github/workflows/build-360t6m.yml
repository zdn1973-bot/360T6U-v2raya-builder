    "'  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy kmod-ipt-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools kmod-wireguard wireguard-tools luci-app-wireguard luci-proto-wireguard' \\"
)

yaml_content = yaml_content.replace(
    "echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config",
    "echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config\n          echo 'CONFIG_PACKAGE_kmod-wireguard=y' >> .config\n          echo 'CONFIG_PACKAGE_wireguard-tools=y' >> .config\n          echo 'CONFIG_PACKAGE_luci-app-wireguard=y' >> .config\n          echo 'CONFIG_PACKAGE_luci-proto-wireguard=y' >> .config"
