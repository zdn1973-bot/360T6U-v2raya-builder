name: Build ImmortalWrt 360T6M v2raya

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M v2raya
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time \
            squashfs-tools

          python3 --version
          gcc --version
          make --version
          dtc --version
          unsquashfs -version || true

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          git log -1 --oneline

      - name: Add 360T6M NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="package/base-files/files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          echo "===== ORIGINAL PLATFORM.SH ====="
          sed -n '1,80p' "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          print("===== PLATFORM CASE MARKERS =====")

          for index, line in enumerate(text.splitlines(), 1):
              stripped = line.strip()
              if stripped.startswith("case ") or stripped == "*)":
                  print(f"{index}: {line}")

          lines = text.splitlines()

          entry = '        360,360t6m|\\'

          found = False

          for line in lines:
              if line.strip() == entry.strip():
                  found = True
                  break

          if not found:
              insert_at = None

              for i, line in enumerate(lines):
                  if line.strip() == 'case "$board" in':
                      insert_at = i + 1
                      break

              if insert_at is None:
                  raise SystemExit(
                      'ERROR: could not locate board case statement'
                  )

              lines.insert(insert_at, entry)
              path.write_text("\n".join(lines) + "\n")

          print("===== MODIFIED PLATFORM CASE =====")

          lines = path.read_text().splitlines()

          for index, line in enumerate(lines, 1):
              if "360,360t6m" in line:
                  start = max(1, index - 4)
                  end = min(len(lines), index + 8)

                  for n in range(start, end + 1):
                      print(f"{n}: {lines[n - 1]}")

                  break
          else:
              raise SystemExit(
                  "ERROR: 360T6M handler was not inserted"
              )
          PY

      - name: Verify 360T6M NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="package/base-files/files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()

          target = "360,360t6m|"

          for i, line in enumerate(lines, 1):
              if target in line:
                  print("FOUND:")
                  print(f"{i}: {line}")
                  break
          else:
              raise SystemExit(
                  "ERROR: 360,360t6m handler is missing"
              )
          PY

          echo "360T6M NAND upgrade handler verified."

      - name: Copy 360T6M DTS
        run: |
          set -e

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Fix green LED
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          sed -i \
            's/GPIO_ACTIVE_HIGH/GPIO_ACTIVE_LOW/g' \
            "$DTS"

          if ! grep -q 'default-state = "on";' "$DTS"; then
            sed -i \
              '/label = "green:system";/a\		default-state = "on";' \
              "$DTS"
          fi

          grep -n -A5 -B2 \
            'green:system' \
            "$DTS"

      - name: Update feeds
        working-directory: source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 360T6M device profile
        working-directory: source
        run: |
          set -e

          IMAGE="target/linux/ramips/image/mt7621.mk"

          printf '%s\n' \
            'define Device/360_t6m' \
            '  $(Device/dsa-migration)' \
            '  $(Device/uimage-lzma-loader)' \
            '  DEVICE_VENDOR := 360' \
            '  DEVICE_MODEL := T6M' \
            '  DEVICE_DTS := mt7621_360_t6m' \
            '  SUPPORTED_DEVICES += 360,360t6m' \
            '  BLOCKSIZE := 128k' \
            '  PAGESIZE := 2048' \
            '  KERNEL_SIZE := 4096k' \
            '  UBINIZE_OPTS := -E 5' \
            '  IMAGE_SIZE := 124928k' \
            '  IMAGES += firmware.bin' \
            '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' \
            '  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' \
            '  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy kmod-ipt-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools' \
            'endef' \
            'TARGET_DEVICES += 360_t6m' \
            >> "$IMAGE"

      - name: Verify DTS
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"
          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"
          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"
          grep -q 'GPIO_ACTIVE_LOW' "$DTS"
          grep -q 'default-state = "on"' "$DTS"
          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"
          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "DTS verification successful."

      - name: Configure target
        working-directory: source
        run: |
          set -e

          echo 'CONFIG_TARGET_ramips=y' > .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-ipt-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_iptables-mod-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_xray-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config

          make defconfig

      - name: Verify package selections
        working-directory: source
        run: |
          set -e

          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nf-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-ipt-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_iptables-mod-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-tun=y$' .config

          echo "All required packages are enabled."

      - name: Download sources
        working-directory: source
        run: |
          set -e
          make download -j2 V=s

      - name: Build firmware
        working-directory: source
        run: |
          set -e
          make -j$(nproc) V=s

      - name: Verify firmware
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          test -f "$IMAGE"
          ls -lh "$IMAGE"

      - name: Verify real rootfs
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          rm -rf /tmp/image-check
          mkdir -p /tmp/image-check

          tar -xf "$IMAGE" -C /tmp/image-check

          ROOT="$(
            find \
              /tmp/image-check \
              -type f \
              -name root \
              -print \
              -quit
          )"

          test -n "$ROOT"
          test -f "$ROOT"

          echo "===== ROOT ====="
          file "$ROOT"

          unsquashfs -l "$ROOT" > /tmp/rootfs-list.txt

          test -s /tmp/rootfs-list.txt

          echo "===== V2RAYA ====="

          grep -q '/usr/bin/v2raya$' /tmp/rootfs-list.txt
          grep -q '/usr/bin/xray$' /tmp/rootfs-list.txt
          grep -q '/etc/init.d/v2raya$' /tmp/rootfs-list.txt

          echo "v2rayA and Xray found."

          echo "===== TPROXY ====="

          grep -E -q \
            'tproxy.*\.ko$|nf.*tproxy.*\.ko$|nft.*tproxy.*\.ko$|ipt.*tproxy.*\.ko$' \
            /tmp/rootfs-list.txt

          echo "TPROXY found."

      - name: Show output
        working-directory: source
        run: |
          set -e

          find \
            bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            -printf '%f %k KB\n' \
            | sort

      - name: Generate SHA256
        working-directory: source
        run: |
          set -e

          find \
            bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            -exec sha256sum {} \; \
            | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-v2raya-NAND-FIX
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
