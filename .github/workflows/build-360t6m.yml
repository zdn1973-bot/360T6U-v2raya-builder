name: Build ImmortalWrt 360T6M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time

          echo "===== TOOL VERSIONS ====="
          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version

      - name: Clone ImmortalWrt
        run: |
          set -eux

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          echo "===== IMMORTALWRT SOURCE ====="
          git log -1 --oneline
          git branch --show-current

      - name: Update feeds
        working-directory: source
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify MT7621 source
        working-directory: source
        run: |
          set -eux

          test -d target/linux/ramips
          test -d target/linux/ramips/dts
          test -f target/linux/ramips/image/mt7621.mk

          echo "===== RAMIPS ====="
          ls -la target/linux/ramips

          echo "===== MT7621 ====="
          ls -la target/linux/ramips/mt7621

      - name: Inspect MT7621 base DTS
        working-directory: source
        run: |
          set -eux

          echo "===== MT7621 LABELS ====="

          grep -nE \
            'state_default|pinctrl|pcie1|gmac0|gmac1|switch0|ethernet|mdio' \
            target/linux/ramips/dts/mt7621.dtsi \
            | head -200 \
            || true

      - name: Create 360T6M DTS
        working-directory: source
        run: |
          set -eux

          cat > target/linux/ramips/dts/mt7621_360_t6m.dts <<'DTS'
/dts-v1/;

#include "mt7621.dtsi"
#include <dt-bindings/gpio/gpio.h>
#include <dt-bindings/input/input.h>

/ {
	compatible = "360,360t6m", "mediatek,mt7621-soc";
	model = "360T6M";

	aliases {
		label-mac-device = &gmac0;

		led-boot = &led_system;
		led-failsafe = &led_system;
		led-running = &led_system;
		led-upgrade = &led_system;
	};

	chosen {
		bootargs = "console=ttyS0,115200";
	};

	leds {
		compatible = "gpio-leds";

		led_system: system {
			label = "green:system";
			gpios = <&gpio 15 GPIO_ACTIVE_HIGH>;
		};

		power {
			label = "red:power";
			gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
		};
	};

	keys {
		compatible = "gpio-keys";

		wps {
			label = "wps";
			gpios = <&gpio 6 GPIO_ACTIVE_LOW>;
			linux,code = <KEY_WPS_BUTTON>;
		};

		reset {
			label = "reset";
			gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
			linux,code = <KEY_RESTART>;
		};
	};
};

&nand {
	status = "okay";

	partitions {
		compatible = "fixed-partitions";
		#address-cells = <1>;
		#size-cells = <1>;

		partition@0 {
			label = "Bootloader";
			reg = <0x000000 0x080000>;
			read-only;
		};

		partition@80000 {
			label = "Nvram";
			reg = <0x080000 0x040000>;
			read-only;
		};

		partition@c0000 {
			label = "Bdata";
			reg = <0x0c0000 0x040000>;
			read-only;
		};

		factory: partition@100000 {
			label = "Factory";
			reg = <0x100000 0x080000>;
			read-only;

			compatible = "nvmem-cells";
			#address-cells = <1>;
			#size-cells = <1>;

			macaddr_factory_0: macaddr@e000 {
				reg = <0xe000 0x06>;
			};

			macaddr_factory_1: macaddr@e006 {
				reg = <0xe006 0x06>;
			};
		};

		partition@180000 {
			label = "crash";
			reg = <0x180000 0x040000>;
			read-only;
		};

		partition@1c0000 {
			label = "crash_log";
			reg = <0x1c0000 0x040000>;
			read-only;
		};

		partition@200000 {
			label = "kernel";
			reg = <0x200000 0x400000>;
		};

		partition@600000 {
			label = "ubi";
			reg = <0x600000 0x7a00000>;
		};
	};
};

&gmac0 {
	nvmem-cells = <&macaddr_factory_0>;
	nvmem-cell-names = "mac-address";
};

&gmac1 {
	nvmem-cells = <&macaddr_factory_1>;
	nvmem-cell-names = "mac-address";
};

&switch0 {
	ports {
		port@0 {
			status = "okay";
			label = "lan3";
		};

		port@1 {
			status = "okay";
			label = "lan2";
		};

		port@2 {
			status = "okay";
			label = "lan1";
		};

		port@3 {
			status = "okay";
			label = "wan";
		};

		port@4 {
			status = "disabled";
			label = "lan4";
		};
	};
};

&pcie {
	status = "okay";
};

&pcie1 {
	wifi@0,0 {
		compatible = "mediatek,mt76";
		reg = <0x0000 0 0 0 0>;
		mediatek,mtd-eeprom = <&factory 0x0>;
	};
};

&state_default {
	gpio {
		groups = "jtag", "wdt", "uart3";
		function = "gpio";
	};
};
DTS

          echo "===== DTS CREATED ====="
          sed -n '1,280p' \
            target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Check DTS syntax
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          echo "===== DTS PREPROCESS CHECK ====="

          cpp \
            -nostdinc \
            -undef \
            -x assembler-with-cpp \
            -I target/linux/ramips/dts \
            "$DTS" \
            -o /tmp/360t6m-preprocessed.dts

          echo "===== DTS DTC CHECK ====="

          dtc \
            -I dts \
            -O dtb \
            -o /tmp/360t6m.dtb \
            -i target/linux/ramips/dts \
            /tmp/360t6m-preprocessed.dts

          test -s /tmp/360t6m.dtb

          echo "DTS compilation successful."
          ls -lh /tmp/360t6m.dtb

      - name: Verify 360T6M DTS contents
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          grep -q '360,360t6m' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"

          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"

          grep -q 'compatible = "mediatek,mt76"' "$DTS"

          grep -q 'green:system' "$DTS"
          grep -q 'red:power' "$DTS"

          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"

          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "360T6M DTS verification successful."

      - name: Add 360T6M image profile
        working-directory: source
        run: |
          set -eux

          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'

define Device/360_t6m
  $(Device/dsa-migration)
  $(Device/uimage-lzma-loader)

  DEVICE_VENDOR := 360
  DEVICE_MODEL := T6M

  BLOCKSIZE := 128k
  PAGESIZE := 2048
  KERNEL_SIZE := 4096k

  UBINIZE_OPTS := -E 5

  IMAGE_SIZE := 124928k

  IMAGES += firmware.bin

  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata

  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size

  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware uboot-envtools
endef

TARGET_DEVICES += 360_t6m

EOF

      - name: Verify image profile
        working-directory: source
        run: |
          set -eux

          echo "===== 360T6M IMAGE PROFILE ====="

          grep -n -A35 -B3 \
            'define Device/360_t6m' \
            target/linux/ramips/image/mt7621.mk

      - name: Configure MT7621
        working-directory: source
        run: |
          set -eux

          make defconfig

          echo "===== TARGET CONFIG ====="

          grep -E \
            '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621' \
            .config \
            || true

      - name: Download sources
        working-directory: source
        run: |
          set -eux

          make download -j2 V=s

      - name: Build firmware
        working-directory: source
        run: |
          set -eux

          make -j$(nproc) V=s

      - name: Show firmware files
        working-directory: source
        run: |
          set -eux

          echo "===== GENERATED FIRMWARE ====="

          find bin/targets/ramips/mt7621 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      - name: Verify firmware output
        working-directory: source
        run: |
          set -eux

          OUT="bin/targets/ramips/mt7621"

          test -d "$OUT"

          find "$OUT" \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.manifest' \
            \) \
            -print \
            | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
