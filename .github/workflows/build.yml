name: Check 360T6M Source

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect ImmortalWrt source for 360T6M
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Show source information
        working-directory: immortalwrt
        run: |
          echo "===== SOURCE ====="
          git log -1 --oneline
          echo
          echo "===== TARGET ====="
          ls -la target/linux/ramips/
          echo
          echo "===== MT7621 ====="
          ls -la target/linux/ramips/mt7621/
          echo
          echo "===== SEARCH 360T6M ====="
          grep -RniE '360t6m|360T6M|360,360t6m' \
            target/linux/ramips 2>/dev/null || true

      - name: Search all source files
        working-directory: immortalwrt
        run: |
          echo "===== GLOBAL SEARCH ====="
          grep -RniE '360t6m|360T6M|360,360t6m' \
            . 2>/dev/null | head -200 || true

      - name: List MT7621 DTS files
        working-directory: immortalwrt
        run: |
          echo "===== MT7621 DTS ====="
          find target/linux/ramips/dts \
            -maxdepth 1 -type f \
            -iname '*mt7621*' \
            -o -iname '*360*' \
            -o -iname '*t6m*' \
            | sort

      - name: Search CR660x relationship
        working-directory: immortalwrt
        run: |
          echo "===== CR660X ====="
          grep -RniE 'cr6606|cr6608|cr6609|cr660x' \
            target/linux/ramips/dts \
            target/linux/ramips/image \
            2>/dev/null | head -200 || true
