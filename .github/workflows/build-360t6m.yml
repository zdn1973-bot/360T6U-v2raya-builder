name: Build ImmortalWrt 360T6M - v2rayA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M v2rayA
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install build dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time

          echo "===== TOOL VERSIONS ====="
          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version

      # ==========================================================
      # 3. Clone ImmortalWrt
      # ==========================================================
      - name: Clone ImmortalWrt
        run: |
          set -eux

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          echo "===== IMMORTALWRT SOURCE ====="
          git log -1 --oneline
          git branch --show-current

      # ==========================================================
      # 4. Copy the DTS from repository
      # ==========================================================
      - name: Copy 360T6M DTS
        run: |
          set -eux

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

          echo "===== DTS COPIED ====="

          ls -lh \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      # ==========================================================
      # 5. Fix 360T6M green LED polarity
      #
      # Real hardware test proved GPIO15 LED is ACTIVE LOW.
      # Also force the system LED ON during boot.
      # ==========================================================
      - name: Fix 360T6M green LED
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          sed -i \
            's/gpios = <\&gpio 15 GPIO_ACTIVE_HIGH>;/gpios = <\&gpio 15 GPIO_ACTIVE_LOW>;/g' \
            "$DTS"

          sed -i \
            '/label = "green:system";/a\                default-state = "on";' \
            "$DTS"

          echo "===== LED CONFIGURATION ====="

          grep -n -A5 -B2 \
            'green:system' \
            "$DTS"

      # ==========================================================
      # 6. Update feeds
      # ==========================================================
      - name: Update feeds
        working-directory: source
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 7. Verify required packages
      # ==========================================================
      - name: Verify required packages
        working-directory: source
        run: |
          set -eux

          echo "===== REQUIRED PACKAGE CHECK ====="

          for pkg in \
            v2raya \
            luci-app-v2raya \
            xray-core \
            iptables-mod-tproxy \
            kmod-nf-tproxy \
            kmod-nft-tproxy
          do
            echo
            echo "Checking package: $pkg"

            grep -Rqs \
              "^Package: $pkg$" \
              package \
              feeds \
              2>/dev/null \
              || {
                echo "ERROR: package not found: $pkg"
                exit 1
              }
          done

          echo
          echo "All required packages were found."

      # ==========================================================
      # 8. Verify DTS
      # ==========================================================
      - name: Verify 360T6M DTS
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          echo "===== DEVICE ====="

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"

          echo
          echo "===== NETWORK ====="

          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"

          echo
          echo "===== WIFI ====="

          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"

          echo
          echo "===== LED ====="

          grep -q 'label = "green:system"' "$DTS"
          grep -q 'GPIO_ACTIVE_LOW' "$DTS"
          grep -q 'default-state = "on"' "$DTS"

          echo
          echo "===== BUTTONS ====="

          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"

          echo
          echo "===== FLASH ====="

          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo
          echo "360T6M DTS verification successful."

      # ==========================================================
      # 9. Check DTS syntax
      # ==========================================================
      - name: Check DTS syntax
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          dtc \
            -I dts \
            -O dtb \
            -i target/linux/ramips/dts \
            -o /tmp/360t6m.dtb \
            "$DTS"

          test -s /tmp/360t6m.dtb

          echo "DTS compilation successful."
          ls -lh /tmp/360t6m.dtb

      # ==========================================================
      # 10. Add 360T6M image profile
      # ==========================================================
      - name: Add 360T6M image profile
        working-directory: source
        run: |
          set -eux

          cat > /tmp/360t6m-device.mk <<'EOF'
          define Device/360_t6m
            $(Device/dsa-migration)
            $(Device/uimage-lzma-loader)

            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_360_t6m

            SUPPORTED_DEVICES += 360,360t6m

            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_SIZE := 4096k

            UBINIZE_OPTS := -E 5

            IMAGE_SIZE := 124928k

            IMAGES += firmware.bin

            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata

            IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size

            DEVICE_PACKAGES += \
              kmod-mt7915e \
              kmod-mt7915-firmware \
              kmod-nf-tproxy \
              kmod-nft-tproxy \
              iptables-mod-tproxy \
              v2raya \
              luci-app-v2raya \
              xray-core \
              kmod-tun \
              uboot-envtools
          endef

          TARGET_DEVICES += 360_t6m
          EOF

          sed \
            's/^          //' \
            /tmp/360t6m-device.mk \
            >> target/linux/ramips/image/mt7621.mk

      # ==========================================================
      # 11. Verify image profile
      # ==========================================================
      - name: Verify image profile
        working-directory: source
        run: |
          set -eux

          echo "===== 360T6M IMAGE PROFILE ====="

          grep -n \
            -A45 \
            -B3 \
            'define Device/360_t6m' \
            target/linux/ramips/image/mt7621.mk

          echo
          echo "===== SUPPORTED DEVICES ====="

          grep -n \
            'SUPPORTED_DEVICES += 360,360t6m' \
            target/linux/ramips/image/mt7621.mk

      # ==========================================================
      # 12. Configure target + packages
      # ==========================================================
      - name: Configure 360T6M v2rayA
        working-directory: source
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y

          CONFIG_PACKAGE_v2raya=y
          CONFIG_PACKAGE_luci-app-v2raya=y
          CONFIG_PACKAGE_xray-core=y

          CONFIG_PACKAGE_kmod-tun=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          echo "===== DEFCONFIG ====="

          make defconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621|^CONFIG_PACKAGE_(kmod-nf-tproxy|kmod-nft-tproxy|iptables-mod-tproxy|v2raya|luci-app-v2raya|xray-core|kmod-tun)' \
            .config \
            || true

      # ==========================================================
      # 13. Verify 360T6M target
      # ==========================================================
      - name: Verify target
        working-directory: source
        run: |
          set -eux

          echo "===== 360T6M PROFILE ====="

          grep -Rni \
            '360_t6m' \
            target/linux/ramips \
            .config \
            2>/dev/null \
            | head -100

      # ==========================================================
      # 14. Download
      # ==========================================================
      - name: Download sources
        working-directory: source
        run: |
          set -eux

          make download -j2 V=s

      # ==========================================================
      # 15. Build
      # ==========================================================
      - name: Build firmware
        working-directory: source
        run: |
          set -eux

          echo "===== START BUILD ====="

          make -j$(nproc) V=s

      # ==========================================================
      # 16. Show firmware
      # ==========================================================
      - name: Show firmware files
        working-directory: source
        run: |
          set -eux

          echo "===== GENERATED FIRMWARE ====="

          find \
            bin/targets/ramips/mt7621 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      # ==========================================================
      # 17. Verify output
      # ==========================================================
      - name: Verify firmware output
        working-directory: source
        run: |
          set -eux

          OUT="bin/targets/ramips/mt7621"

          test -d "$OUT"

          echo "===== FIRMWARE FILES ====="

          find "$OUT" \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.manifest' \
            \) \
            -print \
            | sort

          echo
          echo "===== V2RAYA / XRAY / TPROXY PACKAGES ====="

          find "$OUT" \
            -type f \
            \( \
              -name '*v2raya*.ipk' \
              -o -name '*xray*.ipk' \
              -o -name '*tproxy*.ipk' \
            \) \
            -print \
            | sort \
            || true

      # ==========================================================
      # 18. Upload
      # ==========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-v2raya
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
