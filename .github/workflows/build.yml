name: Build 360T6M OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 360T6M
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clone source
        run: |
          git clone \
            --branch mt7915_mtwifi \
            --depth=1 \
            https://github.com/vb1980/padavanonly_immortalwrt.git \
            source

      - name: Show source
        working-directory: source
        run: |
          echo "===== SOURCE ====="
          git log -1 --oneline
          git branch --show-current

      - name: Create 360T6M DTS
        working-directory: source
        run: |
          cat > target/linux/ramips/dts/mt7621_360_t6m.dts <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          #include "mt7621.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "360,360t6m", "mediatek,mt7621-soc";
              model = "360T6M";

              aliases {
                  label-mac-device = &gmac0;
              };

              chosen {
                  bootargs = "console=ttyS0,115200n8";
              };
          };

          &nand {
              status = "okay";

              partitions {
                  compatible = "fixed-partitions";
                  #address-cells = <1>;
                  #size-cells = <1>;

                  partition@0 {
                      label = "Bootloader";
                      reg = <0x000000 0x080000>;
                      read-only;
                  };

                  partition@80000 {
                      label = "Nvram";
                      reg = <0x080000 0x040000>;
                      read-only;
                  };

                  partition@c0000 {
                      label = "Bdata";
                      reg = <0x0c0000 0x040000>;
                      read-only;
                  };

                  factory: partition@100000 {
                      label = "Factory";
                      reg = <0x100000 0x080000>;
                      read-only;
                  };

                  partition@180000 {
                      label = "crash";
                      reg = <0x180000 0x040000>;
                      read-only;
                  };

                  partition@1c0000 {
                      label = "crash_log";
                      reg = <0x1c0000 0x040000>;
                      read-only;
                  };

                  partition@200000 {
                      label = "kernel";
                      reg = <0x200000 0x400000>;
                  };

                  partition@600000 {
                      label = "ubi";
                      reg = <0x600000 0x07a00000>;
                  };
              };
          };

          &pcie {
              status = "okay";
          };

          &pcie1 {
              wifi@0,0 {
                  compatible = "mediatek,mt76";
                  reg = <0x0000 0 0 0 0>;
                  mediatek,mtd-eeprom = <&factory 0x0>;
              };
          };

          &gmac0 {
              nvmem-cells = <&macaddr_factory_3fff4>;
              nvmem-cell-names = "mac-address";
          };

          &gmac1 {
              nvmem-cells = <&macaddr_factory_3fffa>;
              nvmem-cell-names = "mac-address";
          };

          &factory {
              compatible = "nvmem-cells";
              #address-cells = <1>;
              #size-cells = <1>;

              macaddr_factory_3fff4: macaddr@3fff4 {
                  reg = <0x3fff4 0x6>;
              };

              macaddr_factory_3fffa: macaddr@3fffa {
                  reg = <0x3fffa 0x6>;
              };
          };
          EOF

      - name: Add 360T6M image definition
        working-directory: source
        run: |
          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'

          define Device/360_t6m
            $(Device/xiaomi_nand_separate)
            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_360_t6m
            IMAGE_SIZE := 128512k
            DEVICE_PACKAGES += uboot-envtools
          endef

          TARGET_DEVICES += 360_t6m

          EOF

      - name: Verify DTS and image definition
        working-directory: source
        run: |
          echo "===== 360T6M DTS ====="
          test -f target/linux/ramips/dts/mt7621_360_t6m.dts
          sed -n '1,260p' \
            target/linux/ramips/dts/mt7621_360_t6m.dts

          echo
          echo "===== 360T6M IMAGE ====="
          grep -n -A12 -B2 \
            'Device/360_t6m' \
            target/linux/ramips/image/mt7621.mk

      - name: Build 360T6M firmware
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

          make \
            target/linux/ramips/image/mt7621/compile \
            V=s \
            -j2

      - name: Find firmware
        working-directory: source
        run: |
          echo "===== BUILD OUTPUT ====="

          find bin/targets/ramips/mt7621 \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*360*' \
              -o \
              -name '*t6m*' \
              -o \
              -name '*pbboot*' \
            \) \
            -print \
            | sort

          echo
          echo "===== ALL IMAGES ====="

          find bin/targets/ramips/mt7621 \
            -maxdepth 2 \
            -type f \
            -name '*.bin' \
            -print \
            | sort

      - name: Package firmware
        if: success()
        run: |
          mkdir -p artifact

          find source/bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -name '*360*' \
              -o \
              -name '*t6m*' \
              -o \
              -name '*pbboot*' \
            \) \
            -exec cp {} artifact/ \; \
            || true

          cp -r source/bin/targets/ramips/mt7621 \
            artifact/target-output

          tar -czf 360T6M-firmware.tar.gz \
            -C artifact .

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: 360T6M-firmware
          path: 360T6M-firmware.tar.gz
          if-no-files-found: error
