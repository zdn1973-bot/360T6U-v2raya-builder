هذا الخطأ شائع جداً في أنظمة OpenWrt / ImmortalWrt وتحديداً في نسخ SNAPSHOT (النسخ التجريبية أو الليلية).

السبب الأساسي هو أن نسخة SNAPSHOT تقوم بتحديث النواة (Kernel) بشكل شبه يومي في مستودعات الحزم على الإنترنت. الراوتر الخاص بك يعمل بنواة إصدار 5.15.198 (تم تجميعها في وقت سابق)، بينما المستودع الآن يحتوي على حزم kmod-wireguard مخصصة لنواة أحدث قليلاً (أو بتشفير Hash مختلف)، ولأن WireGuard يحتاج إلى التعديل على نواة النظام، يرفض opkg تثبيته لحماية النظام، بالإضافة إلى أنك ربما لم تقم بتحديث قوائم الحزم (opkg update) قبل أمر التثبيت.

إليك الحلول بالترتيب للتعامل مع هذه المشكلة:

الخطوة 1: تحديث قوائم الحزم (مهم جداً)
من الواضح من المخرجات أنك لم تقم بكتابة أمر التحديث قبل التثبيت، مما جعله لا يتعرف على بعض الحزم. جرب كتابة هذا الأمر أولاً:

Bash
opkg update
ثم أعد محاولة التثبيت:

Bash
opkg install wireguard-tools luci-app-wireguard
الخطوة 2: الإجبار على التثبيت (تخطي مشكلة الـ SNAPSHOT)
إذا قمت بالخطوة الأولى واستمر نفس الخطأ (خاصة خطأ kmod-wireguard)، فيمكننا إجبار النظام على التثبيت بتجاهل تعارض إصدار النواة (غالباً يعمل بدون مشاكل لأن التغييرات في النواة تكون طفيفة جداً).

اكتب هذا الأمر:

Bash
opkg install kmod-wireguard wireguard-tools luci-app-wireguard --force-depends
إذا تم التثبيت بنجاح، قم بإعادة تشغيل الراوتر باستخدام أمر reboot لضمان تحميل إضافات النواة.

الخطوة 3: التحقق مما إذا كان WireGuard مثبتاً بالفعل!
العديد من نسخ ImmortalWrt المعدلة لأجهزة MT7621 تأتي مدمجة أساساً مع WireGuard في النواة ولكن بدون واجهة المستخدم.
اكتب الأمر التالي في الواجهة (الـ Terminal):

Bash
wg
إذا لم يظهر لك شيء (أو لم يعطك رسالة خطأ Not found): فهذا يعني أن WireGuard مثبت بالفعل لديك! يمكنك فوراً تجاهل التثبيت وتطبيق "الطريقة الأولى" (إعدادات سطر الأوامر) التي أرسلتها لك في الرد السابق بالكامل، وسيعمل معك الـ VPN مباشرة دون الحاجة لواجهة LuCI.

الحل الجذري (في حال فشل كل ما سبق)
بما أنك تستخدم نسخة SNAPSHOT، الحل الرسمي والآمن دائماً في OpenWrt لحل مشاكل الـ kmod هو تحديث النظام (Sysupgrade) إلى أحدث نسخة SNAPSHOT متاحة لراوترك (360 T6M) مع الاحتفاظ بالإعدادات، أو تثبيت إصدار مستقر (Stable) مثل 23.05.0 أو 23.05.2، وبعدها سيتم تثبيت الحزم بسلاسة.

نصيحتي: جرب الخطوة 1 ثم الخطوة 2، وإذا تم التثبيت أو وجدت أن أمر wg يعمل، قم بنسخ أوامر إعداد واجهة Wireguard من ردي السابق والصقها وسيتم الاتصال بـ Cloudflare WARP بنجاح.

