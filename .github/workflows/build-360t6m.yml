name: Build ImmortalWrt 360T6M Router1 v2raya_WireGuard_ZRAM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M Router1 v2raya
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time \
            squashfs-tools

          echo "===== TOOLS ====="
          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version
          unsquashfs -version || true

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          echo "===== SOURCE ====="
          git log -1 --oneline
          git branch --show-current

      - name: Patch MT7621 NAND upgrade handler
        working-directory: source
        run: |
          set -e

          PLATFORM="target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
