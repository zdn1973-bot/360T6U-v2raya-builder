name: Build 360T6M ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Install build dependencies
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time \
            ccache \
            perl \
            patch \
            diffutils \
            subversion \
            mercurial \
            libelf-dev \
            device-tree-compiler

          echo "===== PYTHON ====="
          python3 --version

          echo "===== PYTHON DISTUTILS ====="
          python3 -c "import distutils; print('distutils OK')"

          echo "===== GCC ====="
          gcc --version | head -1

          echo "===== MAKE ====="
          make --version | head -1


      # =========================================================
      # 2. Download source
      # =========================================================
      - name: Clone ImmortalWrt source
        run: |
          rm -rf source

          git clone \
            --depth=1 \
            --branch mt7915_mtwifi \
            https://github.com/padavanonly/immortalwrt.git \
            source

          cd source

          echo "===== SOURCE VERSION ====="
          git log -1 --oneline

          echo
          echo "===== BRANCH ====="
          git branch --show-current


      # =========================================================
      # 3. Check MT7621 source
      # =========================================================
      - name: Check MT7621 source
        working-directory: source
        run: |
          echo "===== MT7621 TARGET ====="

          ls -la target/linux/ramips

          echo
          echo "===== MT7621 IMAGE ====="

          ls -la target/linux/ramips/image

          echo
          echo "===== MT7621 DTS ====="

          ls target/linux/ramips/dts | grep -E 'mt7621|cr660' | head -100 || true


      # =========================================================
      # 4. Create 360T6M DTS
      # =========================================================
      - name: Create 360T6M DTS
        working-directory: source
        run: |
          rm -f target/linux/ramips/dts/mt7621_360_t6m.dts

          cat > target/linux/ramips/dts/mt7621_360_t6m.dts <<'DTS'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          #include "mt7621.dtsi"
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>

          / {
              compatible = "360,360t6m", "mediatek,mt7621-soc";
              model = "360T6M";

              aliases {
                  label-mac-device = &gmac0;
              };

              chosen {
                  bootargs = "console=ttyS0,115200n8";
              };

              leds {
                  compatible = "gpio-leds";

                  sys_yellow: sys_yellow {
                      label = "yellow:sys";
                      gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
                  };

                  sys_blue: sys_blue {
                      label = "blue:sys";
                      gpios = <&gpio 16 GPIO_ACTIVE_LOW>;
                  };

                  net_yellow {
                      label = "yellow:net";
                      gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
                  };

                  net_blue {
                      label = "blue:net";
                      gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
                  };
              };

              keys {
                  compatible = "gpio-keys";

                  reset {
                      label = "reset";
                      gpios = <&gpio 18 GPIO_ACTIVE_LOW>;
                      linux,code = <KEY_RESTART>;
                  };

                  wps {
                      label = "wps";
                      gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
                      linux,code = <KEY_WPS_BUTTON>;
                  };
              };
          };

          &nand {
              status = "okay";

              partitions {
                  compatible = "fixed-partitions";

                  #address-cells = <1>;
                  #size-cells = <1>;

                  partition@0 {
                      label = "Bootloader";
                      reg = <0x000000 0x080000>;
                      read-only;
                  };

                  partition@80000 {
                      label = "Nvram";
                      reg = <0x080000 0x040000>;
                      read-only;
                  };

                  partition@c0000 {
                      label = "Bdata";
                      reg = <0x0c0000 0x040000>;
                      read-only;
                  };

                  factory: partition@100000 {
                      label = "Factory";
                      reg = <0x100000 0x080000>;
                      read-only;
                  };

                  partition@180000 {
                      label = "crash";
                      reg = <0x180000 0x040000>;
                      read-only;
                  };

                  partition@1c0000 {
                      label = "crash_log";
                      reg = <0x1c0000 0x040000>;
                      read-only;
                  };

                  partition@200000 {
                      label = "kernel";
                      reg = <0x200000 0x400000>;
                  };

                  partition@600000 {
                      label = "ubi";
                      reg = <0x600000 0x07a00000>;
                  };
              };
          };

          &pcie {
              status = "okay";
          };

          &pcie1 {
              wifi@0,0 {
                  compatible = "mediatek,mt76";
                  reg = <0x0000 0 0 0 0>;
                  mediatek,mtd-eeprom = <&factory 0x0>;
              };
          };

          &gmac0 {
              nvmem-cells = <&macaddr_factory_3fff4>;
              nvmem-cell-names = "mac-address";
          };

          &gmac1 {
              nvmem-cells = <&macaddr_factory_3fffa>;
              nvmem-cell-names = "mac-address";
          };

          &factory {
              compatible = "nvmem-cells";

              #address-cells = <1>;
              #size-cells = <1>;

              macaddr_factory_3fff4: macaddr@3fff4 {
                  reg = <0x3fff4 0x6>;
              };

              macaddr_factory_3fffa: macaddr@3fffa {
                  reg = <0x3fffa 0x6>;
              };
          };
          DTS

          echo "===== 360T6M DTS ====="
          cat target/linux/ramips/dts/mt7621_360_t6m.dts


      # =========================================================
      # 5. Add 360T6M image definition
      # =========================================================
      - name: Add 360T6M image definition
        working-directory: source
        run: |
          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'

          define Device/360_t6m
            $(Device/xiaomi_nand_separate)
            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_360_t6m
            DEVICE_DTS_DIR := ../dts
            IMAGE_SIZE := 128512k
            DEVICE_PACKAGES += uboot-envtools
          endef

          TARGET_DEVICES += 360_t6m

          EOF

          echo "===== 360T6M IMAGE DEFINITION ====="

          grep -n -A15 -B3 \
            'Device/360_t6m' \
            target/linux/ramips/image/mt7621.mk


      # =========================================================
      # 6. Verify device is registered
      # =========================================================
      - name: Verify 360T6M registration
        working-directory: source
        run: |
          echo "===== SEARCH 360T6M ====="

          grep -RniE \
            '360t6m|360T6M|360,360t6m' \
            target/linux/ramips \
            2>/dev/null || true

          echo
          echo "===== IMAGE DEVICE ====="

          grep -n \
            '360_t6m' \
            target/linux/ramips/image/mt7621.mk \
            || true


      # =========================================================
      # 7. Update feeds
      # =========================================================
      - name: Update feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 8. Configure
      # =========================================================
      - name: Configure build
        working-directory: source
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          make defconfig


      # =========================================================
      # 9. Verify target configuration
      # =========================================================
      - name: Verify target configuration
        working-directory: source
        run: |
          echo "===== TARGET CONFIG ====="

          grep -E \
            'CONFIG_TARGET_ramips=y|CONFIG_TARGET_ramips_mt7621=y' \
            .config \
            || true

          echo
          echo "===== 360T6M CONFIG ====="

          grep -E \
            '360_t6m|360T6M' \
            .config \
            || true


      # =========================================================
      # 10. Download sources
      # =========================================================
      - name: Download sources
        working-directory: source
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          make download -j2 V=s


      # =========================================================
      # 11. Build
      # =========================================================
      - name: Build 360T6M
        working-directory: source
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          make \
            target/linux/ramips/image/mt7621/compile \
            V=s \
            -j2


      # =========================================================
      # 12. Display firmware files
      # =========================================================
      - name: Show firmware
        if: always()
        working-directory: source
        run: |
          echo "========================================"
          echo "        ALL MT7621 OUTPUT"
          echo "========================================"

          find bin/targets/ramips/mt7621 \
            -type f \
            -print \
            2>/dev/null \
            | sort || true

          echo
          echo "========================================"
          echo "        360T6M OUTPUT"
          echo "========================================"

          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -iname '*360*' \
              -o \
              -iname '*t6m*' \
              -o \
              -iname '*pbboot*' \
              -o \
              -iname '*kernel1*' \
              -o \
              -iname '*rootfs0*' \
              -o \
              -iname '*breed*' \
            \) \
            -print \
            2>/dev/null \
            | sort || true


      # =========================================================
      # 13. Firmware information
      # =========================================================
      - name: Firmware information
        if: always()
        working-directory: source
        run: |
          echo "===== FIRMWARE FILE INFORMATION ====="

          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -iname '*360*' \
              -o \
              -iname '*t6m*' \
              -o \
              -iname '*pbboot*' \
              -o \
              -iname '*kernel1*' \
              -o \
              -iname '*rootfs0*' \
              -o \
              -iname '*breed*' \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null || true


      # =========================================================
      # 14. SHA256
      # =========================================================
      - name: Generate SHA256
        if: success()
        working-directory: source
        run: |
          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -iname '*360*' \
              -o \
              -iname '*t6m*' \
              -o \
              -iname '*pbboot*' \
              -o \
              -iname '*kernel1*' \
              -o \
              -iname '*rootfs0*' \
              -o \
              -iname '*breed*' \
            \) \
            -exec sha256sum {} \; \
            > /tmp/360t6m-sha256.txt

          cat /tmp/360t6m-sha256.txt


      # =========================================================
      # 15. Upload firmware
      # =========================================================
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 360T6M-ImmortalWrt
          path: |
            source/bin/targets/ramips/mt7621/**/*360*
            source/bin/targets/ramips/mt7621/**/*t6m*
            source/bin/targets/ramips/mt7621/**/*pbboot*
            source/bin/targets/ramips/mt7621/**/*kernel1*
            source/bin/targets/ramips/mt7621/**/*rootfs0*
            source/bin/targets/ramips/mt7621/**/*breed*
          if-no-files-found: warn
