name: Build ImmortalWrt 360T6M v2raya NAND

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time \
            squashfs-tools

          python3 --version
          gcc --version
          make --version
          dtc --version
          unsquashfs -version || true

      - name: Clone ImmortalWrt
        run: |
          set -e

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          git log -1 --oneline

      - name: Locate and patch NAND upgrade script
        working-directory: source
        run: |
          set -e

          echo "===== SEARCH UPGRADE SCRIPTS ====="

          : > /tmp/candidates

          while IFS= read -r file; do
            if grep -q 'platform_do_upgrade' "$file" 2>/dev/null &&
               grep -q 'nand_do_upgrade' "$file" 2>/dev/null; then
              echo "$file"
              echo "$file" >> /tmp/candidates
            fi
          done < <(
            find target package \
              -type f \
              -name 'platform.sh' \
              -print \
              2>/dev/null \
              | sort
          )

          COUNT="$(wc -l < /tmp/candidates)"

          echo
          echo "Candidate count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no NAND platform.sh found"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: multiple NAND platform.sh files found:"
            cat /tmp/candidates
            exit 1
          fi

          PLATFORM="$(cat /tmp/candidates)"

          echo
          echo "===== SELECTED PLATFORM ====="
          echo "$PLATFORM"

          echo
          echo "===== BEFORE PATCH ====="
          grep -n \
            -A25 \
            -B5 \
            'platform_do_upgrade' \
            "$PLATFORM"

          python3 - "$PLATFORM" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])

          lines = path.read_text().splitlines()

          entry = '        360,360t6m|\\'

          if any("360,360t6m" in line for line in lines):
              print("360T6M handler already exists.")
          else:
              in_platform = False
              insert_at = None

              for i, line in enumerate(lines):
                  stripped = line.strip()

                  if stripped.startswith("platform_do_upgrade()"):
                      in_platform = True
                      continue

                  if in_platform and stripped == 'case "$board" in':
                      insert_at = i + 1
                      break

              if insert_at is None:
                  raise SystemExit(
                      "ERROR: platform_do_upgrade case was not found"
                  )

              lines.insert(insert_at, entry)

              path.write_text(
                  "\n".join(lines) + "\n"
              )

              print("360T6M handler inserted.")

          print("===== AFTER PATCH =====")

          new_lines = path.read_text().splitlines()

          for i, line in enumerate(new_lines):
              if "360,360t6m" in line:
                  start = max(0, i - 5)
                  end = min(len(new_lines), i + 12)

                  for n in range(start, end):
                      print(f"{n + 1}: {new_lines[n]}")

                  break
          else:
              raise SystemExit(
                  "ERROR: 360T6M handler not present"
              )
          PY

          echo "$PLATFORM" > /tmp/selected_platform

      - name: Verify NAND handler
        working-directory: source
        run: |
          set -e

          PLATFORM="$(cat /tmp/selected_platform)"

          test -f "$PLATFORM"

          grep -Fq \
            '360,360t6m|\' \
            "$PLATFORM"

          echo "NAND handler verified."
          echo "Platform: $PLATFORM"

      - name: Copy DTS
        run: |
          set -e

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Fix green LED
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          sed -i \
            's/GPIO_ACTIVE_HIGH/GPIO_ACTIVE_LOW/g' \
            "$DTS"

          if ! grep -q 'default-state = "on";' "$DTS"; then
            sed -i \
              '/label = "green:system";/a\		default-state = "on";' \
              "$DTS"
          fi

          grep -n \
            -A5 \
            -B2 \
            'green:system' \
            "$DTS"

      - name: Update feeds
        working-directory: source
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 360T6M device
        working-directory: source
        run: |
          set -e

          IMAGE="target/linux/ramips/image/mt7621.mk"

          printf '%s\n' \
            'define Device/360_t6m' \
            '  $(Device/dsa-migration)' \
            '  $(Device/uimage-lzma-loader)' \
            '  DEVICE_VENDOR := 360' \
            '  DEVICE_MODEL := T6M' \
            '  DEVICE_DTS := mt7621_360_t6m' \
            '  SUPPORTED_DEVICES += 360,360t6m' \
            '  BLOCKSIZE := 128k' \
            '  PAGESIZE := 2048' \
            '  KERNEL_SIZE := 4096k' \
            '  UBINIZE_OPTS := -E 5' \
            '  IMAGE_SIZE := 124928k' \
            '  IMAGES += firmware.bin' \
            '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' \
            '  IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' \
            '  DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware kmod-nf-tproxy kmod-nft-tproxy kmod-ipt-tproxy iptables-mod-tproxy v2raya luci-app-v2raya xray-core kmod-tun uboot-envtools' \
            'endef' \
            'TARGET_DEVICES += 360_t6m' \
            >> "$IMAGE"

      - name: Verify DTS
        working-directory: source
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"
          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"
          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"
          grep -q 'GPIO_ACTIVE_LOW' "$DTS"
          grep -q 'default-state = "on"' "$DTS"
          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"
          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "DTS verification successful."

      - name: Configure
        working-directory: source
        run: |
          set -e

          echo 'CONFIG_TARGET_ramips=y' > .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y' >> .config

          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-ipt-tproxy=y' >> .config
          echo 'CONFIG_PACKAGE_iptables-mod-tproxy=y' >> .config

          echo 'CONFIG_PACKAGE_v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-v2raya=y' >> .config
          echo 'CONFIG_PACKAGE_xray-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config

          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config

          make defconfig

      - name: Verify packages
        working-directory: source
        run: |
          set -e

          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nf-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-ipt-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_iptables-mod-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-v2raya=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config

          echo "All required packages enabled."

      - name: Download
        working-directory: source
        run: |
          set -e
          make download -j2 V=s

      - name: Build
        working-directory: source
        run: |
          set -e
          make -j$(nproc) V=s

      - name: Verify firmware
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          test -f "$IMAGE"

          echo "===== FIRMWARE ====="
          ls -lh "$IMAGE"

      - name: Verify real rootfs
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          rm -rf /tmp/image-check
          mkdir -p /tmp/image-check

          tar -xf "$IMAGE" -C /tmp/image-check

          ROOT="$(
            find /tmp/image-check \
              -type f \
              -name root \
              -print \
              -quit
          )"

          test -n "$ROOT"
          test -f "$ROOT"

          echo "===== ROOT ====="
          file "$ROOT"

          unsquashfs -l \
            "$ROOT" \
            > /tmp/rootfs-list.txt

          test -s /tmp/rootfs-list.txt

      - name: Verify v2rayA Xray TPROXY
        working-directory: source
        run: |
          set -e

          LIST="/tmp/rootfs-list.txt"

          grep -q '/usr/bin/v2raya$' "$LIST"
          echo "OK: /usr/bin/v2raya"

          grep -q '/usr/bin/xray$' "$LIST"
          echo "OK: /usr/bin/xray"

          grep -q '/etc/init.d/v2raya$' "$LIST"
          echo "OK: /etc/init.d/v2raya"

          grep -E -q \
            'tproxy.*\.ko$|nf.*tproxy.*\.ko$|nft.*tproxy.*\.ko$|ipt.*tproxy.*\.ko$' \
            "$LIST"

          echo "OK: TPROXY."

      - name: SHA256
        working-directory: source
        run: |
          set -e

          IMAGE="bin/targets/ramips/mt7621/immortalwrt-ramips-mt7621-360_t6m-squashfs-sysupgrade.bin"

          sha256sum "$IMAGE"
          ls -lh "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-v2raya-NAND-FIX
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
