رسالة الخطأ Unknown package تفسر كل شيء: حزم النواة الخاصة بإصدار 5.15.198 قد تم حذفها نهائياً من سيرفرات ImmortalWrt. سيرفرات الـ SNAPSHOT تقوم بحذف ملفات النواة القديمة يومياً بمجرد صدور تحديث جديد، ولا توجد أي طريقة لتحميل ملف لم يعد موجوداً على السيرفر، وهذا هو سبب فشل التثبيت الإجباري تماماً.

بناءً على خبرتك الممتازة في التعامل مع معالجات ramips/mt7621 (بما فيها راوترات 360) وتعاملك السابق مع بيئة Image Builder، لديك الآن خياران لحل هذه المشكلة نهائياً:

الخيار الأول: بناء النظام عبر Image Builder (الحل الجذري)
بما أنك قمت سابقاً بإنشاء رومات مخصصة لراوترات 360، الحل الأمثل هو بناء روم مخصص جديد (أنصحك باستخدام إصدار مستقر مثل 23.05.3 أو 23.05.4 لتجنب مشاكل SNAPSHOT مستقبلاً).
أثناء البناء، قم بتضمين حزم WireGuard في أمر make image كالتالي:

Bash
kmod-wireguard wireguard-tools luci-app-wireguard luci-proto-wireguard
بعدها قم بتفليش ملف sysupgrade.bin الناتج عبر واجهة الراوتر مع وضع علامة صح على Keep settings ولن تفقد أي إعدادات. بعد الإقلاع، استخدم إعدادات WARP التي أرسلتها لك.

الخيار الثاني: استخدام HomeProxy / Sing-box (بدون تعديل النواة)
أنت تستخدم حزمة HomeProxy ونواة sing-box و Xray. من المميزات القوية جداً في sing-box أنه يدعم بروتوكول WireGuard في طبقة التطبيق (User-space). هذا يعني أنه لا يحتاج إلى حزم النواة kmod-wireguard إطلاقاً ليعمل.

بإمكانك إعداد اتصال Cloudflare WARP كمخرج (Outbound) داخل HomeProxy مباشرة:

افتح إعدادات HomeProxy.

اذهب إلى قسم Routing Node أو Outbounds.

أضف عقدة (Node) جديدة واختر البروتوكول WireGuard.

