لقد تم تعديل ملف YML بنجاح وإضافة حزم WireGuard الخاصة بمشروعك (kmod-wireguard, wireguard-tools, luci-app-wireguard, luci-proto-wireguard).

الملف جاهز للتحميل:

رمز YML
build-360t6m-wireguard
 YML 
التعديلات التي تمت على الملف:

تمت إضافة حزم WireGuard إلى قائمة DEVICE_PACKAGES الخاصة ببروفايل الراوتر (360 T6M).

تمت إضافة أوامر إدراج الحزم ضمن ملف .config لضمان بناء النواة مع دعم بروتوكول WireGuard.

تمت إضافة خطوات للتحقق من وجود إعدادات الحزم ضمن قائمة Verify configuration.

تمت إضافة خطوة فحص الملفات التنفيذية (مثل wg) داخل ملف squashfs للتأكد من نجاح الدمج قبل رفع الملف النهائي.

تم تغيير اسم مخرج البناء (Artifact) ليكون ImmortalWrt-360T6M-Router1-v2raya-wireguard لتمييزه.

يمكنك الآن رفع هذا الملف مباشرة إلى Github Actions لبدء عملية البناء.

اضف اليه ايضا حزمة تثبيت zram

لقد تم تعديل الملف بنجاح وإضافة حزم إعداد الذاكرة الافتراضية ZRAM إلى مشروع البناء الخاص بك.

ملفك الجاهز للتحميل:

