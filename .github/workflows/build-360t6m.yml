الخطأ واضح جداً؛ إصدار opkg المثبت لديك لا يدعم الخيار --force-architecture.

لقد قمت بتعديل السكربت وإزالة هذا الخيار، وسنكتفي بـ --force-depends لتجاوز فحص النواة.

يرجى تنفيذ الخطوات التالية بالتسلسل:

1. تنفيذ أوامر التثبيت المعدلة
انسخ الكود التالي بالكامل ككتلة واحدة والصقه في سطر الأوامر (Terminal). الكود خالٍ من أي نصوص عربية لتجنب مشاكل الترميز:

Bash
opkg update

CURRENT_KERNEL=$(grep -A 1 '^Package: kernel$' /usr/lib/opkg/status | grep Version | awk '{print $2}')
REPO_KERNEL=$(opkg info kernel | grep -m 1 Version | awk '{print $2}')

cp /usr/lib/opkg/status /usr/lib/opkg/status.backup
sed -i "s/$CURRENT_KERNEL/$REPO_KERNEL/g" /usr/lib/opkg/status

opkg install kmod-wireguard wireguard-tools luci-app-wireguard luci-proto-wireguard --force-depends

sed -i "s/$REPO_KERNEL/$CURRENT_KERNEL/g" /usr/lib/opkg/status

reboot
2. التحقق من التثبيت
بعد أن يعيد الراوتر تشغيل نفسه، سجل الدخول مرة أخرى عبر SSH واكتب هذا الأمر للتحقق من أن WireGuard يعمل وللرد على نجاح الخطوة:

Bash
wg
إذا لم تظهر لك رسالة خطأ (مثل not found)، فهذا يعني أن النواة قبلت الإضافة وتم التثبيت بنجاح.

3. تطبيق إعدادات Cloudflare
إذا نجحت الخطوة السابقة، يمكنك الآن تشغيل السكربت الخاص بإعدادات اتصال Cloudflare WARP الذي أعددته لك:

