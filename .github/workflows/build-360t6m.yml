هذه المخرجات تؤكد المشكلة تماماً: راوترك يعمل بنسخة SNAPSHOT (نسخة تطويرية تتحدث يومياً)، وملفات النواة (Kernel) المتاحة حالياً على سيرفرات ImmortalWrt أصبحت أحدث من النواة الموجودة في راوترك (5.15.198). لذلك، النظام يرفض قطعياً تثبيت إضافات النواة kmod-wireguard لاختلاف الإصدار، وبدونه لا يمكن تشغيل WireGuard.

بما أن التثبيت الإجباري فشل، لا يمكنك تثبيت WireGuard على نسختك الحالية عبر أوامر opkg أبداً.

الحل الجذري والآمن هو تحديث النظام (Sysupgrade) إلى أحدث إصدار مستقر (Stable) بدلاً من نسخة الـ SNAPSHOT، مع دمج حزم WireGuard داخل السوفتوير قبل تحميله. لا تقلق، يمكنك القيام بذلك مع الاحتفاظ بكافة إعداداتك الحالية (بما فيها شبكات الواي فاي وكلمات المرور).

إليك خطوات حل هذه المشكلة نهائياً:

افتح متصفحك واذهب إلى الموقع الرسمي لمنشئ رومات ImmortalWrt:
[https://firmware-selector.immortalwrt.org](https://firmware-selector.immortalwrt.org)

في مربع البحث (Model)، ابحث عن موديل راوترك: 360 T6M (أو Qihoo 360 T6M).

في خانة الإصدار (Version)، اختر أحدث إصدار مستقر (مثلاً 23.05.3 أو 23.05.4)، وتجنب اختيار SNAPSHOT.

في المربع النصي الخاص بالحزم (Installed Packages)، لا تمسح المكتوب، بل انزل لآخر السطر وأضف مسافة ثم انسخ والصق هذه الحزم الثلاث:
kmod-wireguard wireguard-tools luci-app-wireguard

اضغط على زر Request Build (طلب بناء).

انتظر دقيقة حتى يكتمل البناء، ثم قم بتحميل الملف الذي ينتهي بكلمة sysupgrade.bin.

طريقة تثبيت الملف في الراوتر:

ادخل إلى واجهة الراوتر (LuCI).

اذهب إلى System ثم Backup / Flash Firmware.

انزل لأسفل إلى قسم Flash new firmware image واضغط على Flash image.

ارفع ملف sysupgrade.bin الذي قمت بتحميله.

تأكد من وضع علامة الصح على خيار Keep settings (الاحتفاظ بالإعدادات).

اضغط Continue وانتظر حتى يعيد الراوتر تشغيل نفسه (حوالي 3-5 دقائق).

بمجرد عودة الراوتر للعمل، سيكون بإصدار مستقر وستجد إضافة WireGuard موجودة مسبقاً في قائمة Network -> Interfaces دون الحاجة لأي أوامر، ويمكنك حينها تطبيق إعدادات Cloudflare الخاصة بك مباشرة.

الموديل غير موجود في قاعدة البيانات

بما أن الموديل غير مدرج في قاعدة البيانات الرسمية (وهذا أمر شائع في أجهزة 360 المعدلة)، سنقوم بحل مشكلة توافق النواة (Kernel Mismatch) برمجياً من داخل الراوتر.

سنقوم بخداع مدير الحزم لتغيير بصمة النواة (vermagic) مؤقتاً لتتطابق مع المستودع المتصل بالإنترنت، ثم تثبيت إضافات WireGuard، وبعدها إعادة البصمة إلى وضعها الأصلي لضمان استقرار النظام.

الخطوة 1: تجاوز حماية النواة وتثبيت الحزم
انسخ هذه الأوامر ككتلة واحدة والصقها في واجهة سطر الأوامر (SSH). الأوامر خالية من أي نصوص عربية لتجنب مشاكل الترميز:

Bash
opkg update

CURRENT_KERNEL=$(grep -A 1 '^Package: kernel$' /usr/lib/opkg/status | grep Version | awk '{print $2}')
REPO_KERNEL=$(opkg info kernel | grep -m 1 Version | awk '{print $2}')

cp /usr/lib/opkg/status /usr/lib/opkg/status.backup
sed -i "s/$CURRENT_KERNEL/$REPO_KERNEL/g" /usr/lib/opkg/status

opkg install kmod-wireguard wireguard-tools luci-app-wireguard luci-proto-wireguard --force-depends --force-architecture

sed -i "s/$REPO_KERNEL/$CURRENT_KERNEL/g" /usr/lib/opkg/status

reboot
الخطوة 2: التحقق من التثبيت
بعد إعادة تشغيل الراوتر، قم بتسجيل الدخول مجدداً عبر SSH واكتب هذا الأمر لاختبار عمل الإضافة:

Bash
wg
إذا لم يظهر لك خطأ (مثل module not found)، فهذا يعني أن التثبيت تم بنجاح، ويمكنك الآن تطبيق إعدادات Cloudflare WARP التي أرسلتها لك مسبقاً سواء عبر SSH أو من خلال واجهة LuCI.

