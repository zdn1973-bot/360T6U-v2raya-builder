name: Build ImmortalWrt 360T6M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 360T6M
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            libelf-dev \
            libxml-parser-perl \
            swig \
            time

          python3 --version
          gcc --version
          g++ --version
          make --version
          dtc --version

      - name: Clone ImmortalWrt
        run: |
          set -eux

          rm -rf source

          git clone \
            --depth=1 \
            --branch=openwrt-23.05 \
            https://github.com/immortalwrt/immortalwrt.git \
            source

          cd source

          git log -1 --oneline
          git branch --show-current

      - name: Copy 360T6M DTS
        run: |
          set -eux

          test -f target/linux/ramips/dts/mt7621_360_t6m.dts

          mkdir -p source/target/linux/ramips/dts

          cp \
            target/linux/ramips/dts/mt7621_360_t6m.dts \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

          echo "===== DTS COPIED ====="

          ls -lh \
            source/target/linux/ramips/dts/mt7621_360_t6m.dts

      - name: Update feeds
        working-directory: source
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add 360T6M image profile
        working-directory: source
        run: |
          set -eux

          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'

          define Device/360_t6m
            $(Device/dsa-migration)
            $(Device/uimage-lzma-loader)

            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_360_t6m

            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_SIZE := 4096k

            UBINIZE_OPTS := -E 5

            IMAGE_SIZE := 124928k

            IMAGES += firmware.bin

            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata

            IMAGE/firmware.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size

            DEVICE_PACKAGES += kmod-mt7915e kmod-mt7915-firmware uboot-envtools
          endef

          TARGET_DEVICES += 360_t6m

          EOF

      - name: Verify DTS
        working-directory: source
        run: |
          set -eux

          DTS="target/linux/ramips/dts/mt7621_360_t6m.dts"

          test -f "$DTS"

          echo "===== DTS CHECK ====="

          grep -q 'compatible = "360,360t6m"' "$DTS"
          grep -q 'model = "360T6M"' "$DTS"

          grep -q 'label = "wan"' "$DTS"
          grep -q 'label = "lan1"' "$DTS"
          grep -q 'label = "lan2"' "$DTS"
          grep -q 'label = "lan3"' "$DTS"

          grep -q 'compatible = "mediatek,mt76"' "$DTS"
          grep -q 'mediatek,mtd-eeprom' "$DTS"

          grep -q 'KEY_WPS_BUTTON' "$DTS"
          grep -q 'KEY_RESTART' "$DTS"

          grep -q 'label = "kernel"' "$DTS"
          grep -q 'label = "ubi"' "$DTS"

          echo "===== DTS CONTENT ====="

          sed -n '1,260p' "$DTS"

      - name: Verify image profile
        working-directory: source
        run: |
          set -eux

          echo "===== IMAGE PROFILE ====="

          grep -n -A35 -B3 \
            'define Device/360_t6m' \
            target/linux/ramips/image/mt7621.mk

      - name: Configure MT7621
        working-directory: source
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          EOF

          make defconfig

          echo "===== TARGET CONFIG ====="

          grep -E \
            '^CONFIG_TARGET_ramips|^CONFIG_TARGET_ramips_mt7621' \
            .config \
            || true

      - name: Check 360T6M profile
        working-directory: source
        run: |
          set -eux

          echo "===== 360T6M PROFILE ====="

          grep -Rni \
            '360_t6m' \
            target/linux/ramips \
            .config \
            2>/dev/null \
            | head -100

      - name: Download sources
        working-directory: source
        run: |
          set -eux

          make download -j2 V=s

      - name: Build firmware
        working-directory: source
        run: |
          set -eux

          echo "===== START BUILD ====="

          make -j$(nproc) V=s

      - name: Show firmware files
        working-directory: source
        run: |
          set -eux

          echo "===== GENERATED FIRMWARE ====="

          find \
            bin/targets/ramips/mt7621 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      - name: Verify firmware output
        working-directory: source
        run: |
          set -eux

          OUT="bin/targets/ramips/mt7621"

          test -d "$OUT"

          echo "===== FIRMWARE FILES ====="

          find "$OUT" \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.manifest' \
            \) \
            -print \
            | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M
          path: source/bin/targets/ramips/mt7621/**/*
          if-no-files-found: error
          retention-days: 30
