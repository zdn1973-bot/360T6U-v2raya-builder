خطوة إضافية هامة (إعداد DNS)
بما أنك تقوم بتوجيه كل حركة المرور (0.0.0.0/0) عبر WireGuard، يجب التأكد من عدم حدوث تسريب للـ DNS وضبطه على خوادم Cloudflare المرفقة في إعداداتك:

اذهب إلى Network -> DHCP and DNS.

في خانة DNS forwardings، أضف 1.1.1.1 و 1.0.0.1.

اضغط Save & Apply.

للتحقق من نجاح الاتصال، اذهب إلى Status -> WireGuard. يجب أن ترى حجم البيانات (RX/TX) يرتفع، مما يعني أن الاتصال تم بنجاح.

